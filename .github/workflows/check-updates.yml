name: Daily Upstream Version Check

on:
  schedule:
    - cron: '0 4 * * *' # Codziennie o 04:00 UTC
  workflow_dispatch: # Możliwość ręcznego uruchomienia z panelu GitHub Actions

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check for newer container base versions
        run: composer run check-updates

      - name: Check for Git changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected in matrix and Dockerfiles."
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Create Pull Request with Updates
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): automated daily upstream containers update"
          title: "🤖 Automated Daily Upstream Container Updates"
          body-path: updates-summary.md
          branch: auto-update/upstream-images
          delete-branch: true
          labels: |
            dependencies
            automated-pr
