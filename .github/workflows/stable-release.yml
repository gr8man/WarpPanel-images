name: Build, Test & Publish Matrix (Stable)

on:
  workflow_dispatch: # Na żądanie lub po zatwierdzeniu PR z aktualizacją wersji modułów
  push:
    branches:
      - stable

permissions:
  contents: write
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BUILD_CHANNEL: stable

jobs:
  build-stable-images:
    name: Build & Push Stable [${{ matrix.target }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Webserwery
          - nginx
          - apache
          - openlitespeed
          - caddy
          - lighttpd
          # Traefik (Edge Router & Load Balancer)
          - traefik-v2_11
          - traefik-v3_1
          - traefik-v3_2
          - traefik-v3_3
          # PHP-FPM Modern
          - php-fpm-8_0
          - php-fpm-8_1
          - php-fpm-8_2
          - php-fpm-8_3
          - php-fpm-8_4
          - php-fpm-8_5
          # PHP-FPM Legacy
          - php-fpm-5_6
          - php-fpm-7_0
          - php-fpm-7_1
          - php-fpm-7_2
          - php-fpm-7_3
          - php-fpm-7_4
          # FrankenPHP
          - frankenphp-8_2
          - frankenphp-8_3
          - frankenphp-8_4
          - frankenphp-8_5
          # Databases
          - mysql-8_4
          - mysql-8_0
          - mariadb-11_4
          - mariadb-10_11
          - postgres-17
          - postgres-16
          - redis-7_4
          - redis-7_2
          - mongodb-7_0
          - mongodb-8_0

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: yaml, mbstring, json
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Set up QEMU (Multi-platform Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dockerfiles & docker-bake.hcl for Stable Channel
        run: composer run generate

      - name: Build & Push Target via Docker Bake (Stable Channel)
        run: docker buildx bake --file docker-bake.hcl "${{ matrix.target }}" --push

      - name: Run End-to-End Stack Integration Tests on Candidate
        run: php scripts/test.php --target="${{ matrix.target }}"

      - name: Upload Verification Artifact for Stable
        uses: actions/upload-artifact@v4
        with:
          name: stable-verification-${{ matrix.target }}
          path: verifications/verification-${{ matrix.target }}.json
          retention-days: 7

  finalize-stable-catalog:
    name: Finalize Stable Catalog
    needs: build-stable-images
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: yaml, mbstring, json
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Download Verification Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stable-verification-*
          path: downloaded-verifications
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate Verified Images into catalog.json & CATALOG.md (Stable Channel)
        run: php scripts/aggregate_catalog.php downloaded-verifications

      - name: Commit and Push Verified Stable Catalog
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f catalog.json available-images.json CATALOG.md catalog/
          if ! git diff --staged --quiet; then
            echo "[*] Committing verified stable catalog updates..."
            git commit -m "chore(catalog): auto-update verified stable catalog [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi
