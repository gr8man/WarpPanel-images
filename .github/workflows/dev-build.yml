name: Dev Experimental Build & Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build/test (e.g. all, php, frankenphp, webservers, databases, php-fpm-8_3, frankenphp-8_5, nginx, mysql-8_4)'
        required: true
        default: 'php-fpm-8_3'
      push_images:
        description: 'Push built images to GHCR (with -dev tag)'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BUILD_CHANNEL: dev

jobs:
  dev-build-and-test:
    name: Dev Build & Test [${{ inputs.target }}]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: yaml, mbstring, json
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Set up QEMU (Multi-platform Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push_images == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dockerfiles & docker-bake.hcl for Dev Channel
        run: composer run generate

      - name: Build Images via Docker Bake (Dev Channel)
        run: |
          TARGET="${{ inputs.target }}"
          PUSH_FLAG="${{ inputs.push_images == true && '--push' || '--load' }}"
          if [ "$TARGET" = "all" ]; then
            docker buildx bake --file docker-bake.hcl default $PUSH_FLAG
          else
            docker buildx bake --file docker-bake.hcl "$TARGET" $PUSH_FLAG
          fi

      - name: Run Integration Tests on Dev Build
        run: |
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            php scripts/test.php
          else
            php scripts/test.php --target="$TARGET"
          fi

      - name: Upload Verification Manifests
        uses: actions/upload-artifact@v4
        with:
          name: dev-verification-results
          path: verifications/
          retention-days: 7
