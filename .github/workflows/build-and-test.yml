name: Build, Test and Publish WarpPanel Images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Co poniedziałek o 03:00 UTC

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. RÓWNOLEGŁE BUDOWANIE, TESTOWANIE I PUBLIKACJA KAŻDEGO OBRAZU
  # ============================================================================
  build-image:
    name: Build & Test [${{ matrix.target }}]
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    strategy:
      fail-fast: false # Błąd jednego obrazu nie przerywa pozostałych!
      matrix:
        target:
          # Webserwery
          - nginx
          - apache
          - openlitespeed
          # PHP-FPM Modern
          - php-fpm-8_0
          - php-fpm-8_1
          - php-fpm-8_2
          - php-fpm-8_3
          - php-fpm-8_4
          - php-fpm-8_5
          # PHP-FPM Legacy
          - php-fpm-5_6
          - php-fpm-7_0
          - php-fpm-7_1
          - php-fpm-7_2
          - php-fpm-7_3
          - php-fpm-7_4
          # FrankenPHP
          - frankenphp-8_2
          - frankenphp-8_3
          - frankenphp-8_4
          - frankenphp-8_5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfiles & Manifests
        run: composer run generate

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Budowanie i publikacja konkretnego celu z macierzy
      - name: Build & Push [${{ matrix.target }}]
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max

      # Uruchomienie testu weryfikacyjnego dla tego celu
      - name: Run Verification Test [${{ matrix.target }}]
        run: php scripts/test.php --target=${{ matrix.target }}

      # Zapisanie wyniku weryfikacji jako artefaktu
      - name: Upload Target Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.target }}
          path: verifications/verification-${{ matrix.target }}.json

  # ============================================================================
  # 2. FINALIZACJA I AGREGACJA KATALOGU SPRAWDZONYCH OBRAZÓW (catalog.json)
  # ============================================================================
  finalize-catalog:
    name: Aggregate & Finalize Catalog
    needs: build-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download all verification records
        uses: actions/download-artifact@v4
        with:
          path: downloaded-verifications

      - name: Aggregate Verified Images into catalog.json & CATALOG.md
        run: php scripts/aggregate_catalog.php downloaded-verifications

      - name: Upload Consolidated Catalog Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warppanel-verified-catalog
          path: |
            CATALOG.md
            catalog.json
            available-images.json
