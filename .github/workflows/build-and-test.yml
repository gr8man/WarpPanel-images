name: Build, Test and Publish WarpPanel Images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Ręczne uruchomienie publikacji z poziomu GitHub Actions
  schedule:
    - cron: '0 3 * * 1' # Co poniedziałek o 03:00 UTC

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfiles & Manifests
        run: composer run generate

      - name: Run Integration Tests
        run: composer run test

      # 1. Log in to GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Optional: Log in to Docker Hub (if secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are provided)
      - name: Log in to Docker Hub (Optional)
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and Push Multi-arch Verified Images
      - name: Build and Push Verified Images (Bake)
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@v4
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
