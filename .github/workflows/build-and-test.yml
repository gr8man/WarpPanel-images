name: Build, Test & Publish Matrix

on:
  schedule:
    - cron: '0 0 * * *' # Codziennie o północy (00:00 UTC)
  workflow_dispatch: # Na żądanie z panelu GitHub Actions

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # ETAP 1: RÓWNOLEGŁE BUDOWANIE I PUBLIKACJA WSZYSTKICH OBRAZÓW (GHCR)
  # ============================================================================
  build-images:
    name: Build & Push [${{ matrix.target }}]
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    strategy:
      fail-fast: false # Błąd jednego obrazu nie przerywa pozostałych!
      matrix:
        target:
          # Webserwery
          - nginx
          - apache
          - openlitespeed
          # PHP-FPM Modern
          - php-fpm-8_0
          - php-fpm-8_1
          - php-fpm-8_2
          - php-fpm-8_3
          - php-fpm-8_4
          - php-fpm-8_5
          # PHP-FPM Legacy
          - php-fpm-5_6
          - php-fpm-7_0
          - php-fpm-7_1
          - php-fpm-7_2
          - php-fpm-7_3
          - php-fpm-7_4
          # FrankenPHP
          - frankenphp-8_2
          - frankenphp-8_3
          - frankenphp-8_4
          - frankenphp-8_5
          # Bazy Danych Sieciowe
          - mysql-8_4
          - mysql-8_0
          - mariadb-11_4
          - mariadb-10_11
          - postgres-17
          - postgres-16
          - redis-7_4
          - redis-7_2
          - mongodb-7_0
          - mongodb-8_0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfiles & Manifests
        run: composer run generate

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push [${{ matrix.target }}]
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max

  # ============================================================================
  # ETAP 2: TESTY INTEGRACYJNE (PO ZBUDOWANIU WSZYSTKICH KONTENERÓW)
  # ============================================================================
  test-images:
    name: Integration Test [${{ matrix.target }}]
    needs: build-images
    if: always()
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Webserwery
          - nginx
          - apache
          - openlitespeed
          # PHP-FPM Modern
          - php-fpm-8_0
          - php-fpm-8_1
          - php-fpm-8_2
          - php-fpm-8_3
          - php-fpm-8_4
          - php-fpm-8_5
          # PHP-FPM Legacy
          - php-fpm-5_6
          - php-fpm-7_0
          - php-fpm-7_1
          - php-fpm-7_2
          - php-fpm-7_3
          - php-fpm-7_4
          # FrankenPHP
          - frankenphp-8_2
          - frankenphp-8_3
          - frankenphp-8_4
          - frankenphp-8_5
          # Bazy Danych
          - mysql-8_4
          - mysql-8_0
          - mariadb-11_4
          - mariadb-10_11
          - postgres-17
          - postgres-16
          - redis-7_4
          - redis-7_2
          - mongodb-7_0
          - mongodb-8_0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Uruchomienie testu integracyjnego (pobiera zbudowane obrazy z GHCR)
      - name: Run Integration Test [${{ matrix.target }}]
        run: php scripts/test.php --target=${{ matrix.target }}

      # Zapisanie wyniku weryfikacji jako artefaktu (TYLKO JEŚLI TEST PRZESZEDŁ)
      - name: Upload Target Verification Record
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.target }}
          path: verifications/verification-${{ matrix.target }}.json

  # ============================================================================
  # ETAP 3: FINALIZACJA I AGREGACJA KATALOGU SPRAWDZONYCH OBRAZÓW (catalog.json)
  # ============================================================================
  finalize-catalog:
    name: Aggregate & Finalize Catalog
    needs: [build-images, test-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download all verification records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verification-*
          path: downloaded-verifications
          merge-multiple: true

      - name: Aggregate Verified Images into catalog.json & CATALOG.md
        run: php scripts/aggregate_catalog.php downloaded-verifications

      - name: Upload Consolidated Catalog Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warppanel-verified-catalog
          path: |
            CATALOG.md
            catalog.json
            available-images.json

      - name: Commit and Push Verified Catalog to Repository
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f catalog.json available-images.json CATALOG.md
          if ! git diff --staged --quiet; then
            echo "[*] Committing verified catalog updates..."
            git commit -m "chore(catalog): auto-update verified images catalog [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "[*] No catalog changes to commit."
          fi
