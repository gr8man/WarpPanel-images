# Security Headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-XSS-Protection "1; mode=block"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Block sensitive files
<FilesMatch "(^\.|\.(env|git|svn|bak|backup|old|sql|tar|gz|zip|tgz|bz2|conf|log|sh|ini|swp|dist|sample)$)">
    Require all denied
</FilesMatch>

# Basic exploit prevention via mod_rewrite
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{QUERY_STRING} (base64_(en|de)code[^(]*\() [NC,OR]
    RewriteCond %{QUERY_STRING} (<|%3C).*script.*(>|%3E) [NC,OR]
    RewriteCond %{QUERY_STRING} GLOBALS(=|\[|\%[0-9A-Z]{0,2}) [NC,OR]
    RewriteCond %{QUERY_STRING} _REQUEST(=|\[|\%[0-9A-Z]{0,2}) [NC,OR]
    RewriteCond %{QUERY_STRING} union.*select.*\( [NC,OR]
    RewriteCond %{QUERY_STRING} (proc/self/environ|etc/passwd|boot.ini) [NC]
    RewriteRule .* - [F]
</IfModule>
