# ==============================================================================
# WarpPanel Basic WAF & Security Rules for Nginx
# ==============================================================================

# Block hidden files, git, env, composer, npm, sensitive dotfiles
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block sensitive extensions and backups
location ~* \.(env|git|svn|bak|backup|old|sql|tar|gz|zip|tgz|bz2|conf|log|sh|ini|swp|dist|sample)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block common vulnerability scanners & exploit patterns
if ($query_string ~* "base64_(en|de)code[^(]*\(") {
    return 403;
}
if ($query_string ~* "(<|%3C).*script.*(>|%3E)") {
    return 403;
}
if ($query_string ~* "GLOBALS(=|\[|\%[0-9A-Z]{0,2})") {
    return 403;
}
if ($query_string ~* "_REQUEST(=|\[|\%[0-9A-Z]{0,2})") {
    return 403;
}
if ($query_string ~* "union.*select.*\(.*") {
    return 403;
}
if ($query_string ~* "(proc/self/environ|etc/passwd|boot.ini)") {
    return 403;
}

# Security Headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
