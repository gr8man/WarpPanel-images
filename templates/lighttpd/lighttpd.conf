server.modules = (
    "mod_access",
    "mod_alias",
    "mod_deflate",
    "mod_redirect",
    "mod_rewrite",
    "mod_fastcgi",
    "mod_extforward",
    "mod_setenv"
)

server.document-root        = env.WEB_DOCUMENT_ROOT
server.upload-dirs          = ( "/tmp" )
server.errorlog             = "/dev/stderr"
server.pid-file             = "/run/lighttpd.pid"
server.username             = "lighttpd"
server.groupname            = "lighttpd"
server.port                 = 80

index-file.names            = ( "index.php", "index.html", "index.htm" )
url.access-deny             = ( "~", ".inc", ".env", ".git", ".sql", ".bak", "composer.json", "composer.lock" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

mimetype.assign             = (
  ".html" => "text/html",
  ".htm"  => "text/html",
  ".txt"  => "text/plain",
  ".jpg"  => "image/jpeg",
  ".png"  => "image/png",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".svg"  => "image/svg+xml"
)

# Cloudflare Real-IP support
extforward.forwarder = ( "all" => "trust" )
extforward.headers = ( "CF-Connecting-IP", "X-Forwarded-For" )

# FastCGI PHP-FPM Backend
fastcgi.server = ( ".php" =>
  ((
    "host" => env.PHP_FPM_HOST,
    "port" => env.PHP_FPM_PORT,
    "broken-scriptfilename" => "enable"
  ))
)
